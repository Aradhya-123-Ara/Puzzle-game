<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sliding Puzzle Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .game-info {
            margin: 10px;
            font-size: 18px;
        }

        #puzzle {
            width: 320px;
            height: 320px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .tile {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.2s;
        }

        .tile:hover {
            transform: scale(1.05);
        }

        .empty {
            background: transparent;
            cursor: default;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #38bdf8;
            color: black;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🧩 Sliding Puzzle Game</h1>

    <div class="game-info">
        Moves: <span id="moves">0</span> |
        Time: <span id="time">0</span>s
    </div>

    <div id="puzzle"></div>

    <button onclick="startGame()">Shuffle</button>

    <script>
        let board = [];
        let moves = 0;
        let timer = 0;
        let interval;

        const puzzle = document.getElementById("puzzle");

        function startGame() {
            board = [...Array(15).keys()].map(x => x + 1);
            board.push(""); // empty tile
            shuffle(board);

            moves = 0;
            timer = 0;

            clearInterval(interval);
            interval = setInterval(() => {
                timer++;
                document.getElementById("time").innerText = timer;
            }, 1000);

            document.getElementById("moves").innerText = moves;
            render();
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function render() {
            puzzle.innerHTML = "";

            board.forEach((num, index) => {
                const tile = document.createElement("div");
                tile.classList.add("tile");

                if (num === "") {
                    tile.classList.add("empty");
                } else {
                    tile.innerText = num;
                    tile.addEventListener("click", () => moveTile(index));
                }

                puzzle.appendChild(tile);
            });
        }

        function moveTile(index) {
            const emptyIndex = board.indexOf("");

            const validMoves = [
                index - 1,
                index + 1,
                index - 4,
                index + 4
            ];

            if (validMoves.includes(emptyIndex)) {
                [board[index], board[emptyIndex]] = [board[emptyIndex], board[index]];
                moves++;
                document.getElementById("moves").innerText = moves;
                render();
                checkWin();
            }
        }

        function checkWin() {
            for (let i = 0; i < 15; i++) {
                if (board[i] !== i + 1) return;
            }

            clearInterval(interval);
            setTimeout(() => {
                alert("🎉 You solved it in " + moves + " moves and " + timer + " seconds!");
            }, 200);
        }

        startGame();
    </script>

</body>

</html>
